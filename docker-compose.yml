services:
  backend:
    build: .
    container_name: nest-portfolio-backend
    ports:
      # host:container — container listens on APP_PORT (from .env, default 5000)
      - '8080:5000'
    depends_on:
      - db
    # All required env vars (JWT_SECRET, ADMIN_PWD, FRONT_URL, REVALIDATE_SECRET,
    # TRUSTED_ORIGINS, APP_PORT, ...) come from .env so boot-time validation passes.
    env_file:
      - .env
    environment:
      # Override .env's host-oriented URL: inside the compose network Postgres
      # listens on 5432 (the 5433:5432 mapping below only affects the host).
      DATABASE_URL: postgres://postgres:postgres@db:5432/portfolio
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev # hot reload en dev

  db:
    image: postgres:15
    container_name: nest-portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

